plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Loom adds the essential maven repositories to download Minecraft and
	// libraries from automatically. Add other repositories here only when
	// depending on other mods.
	maven {
		name = 'MavenCentralGCS'
		url = 'https://maven-central.storage-download.googleapis.com/maven2/'
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mcremote" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// ./gradlew runClient -PjoinWorld="World Name" auto-joins that world on start
	runs {
		client {
			if (project.hasProperty("joinWorld")) {
				programArgs "--quickPlaySingleplayer", project.property("joinWorld")
			}
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API: used for client tick and chat events.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
